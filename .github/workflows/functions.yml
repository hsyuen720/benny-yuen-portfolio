name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # SITE_URL is a non-secret params value; firebase reads it from functions/.env
      - name: Write params
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: echo "SITE_URL=$SITE_URL" > .env

      - name: Deploy
        run: npx --yes firebase-tools@15.35.0 deploy --only functions --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
